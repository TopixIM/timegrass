name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1
      with:
        tools: calcit,caps


    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Validate Calcit snapshot
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry server --check-only
        calcit calcit.cirru analyze deprecated
        calcit calcit.cirru test app.client/choose-recovery-action --tag client --require-match

    - name: Build browser client
      run: yarn compile-page && yarn release-page

    - run: mkdir -p dist-server && cp calcit.cirru dist-server && cp package.json dist-server/
      name: Copy server scripts

    - name: Check deploy key availability
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "ERROR: DEPLOY_KEY (rsync_private_key) is empty or not available."
          echo ""
          echo "This is likely because this workflow was triggered by Dependabot."
          echo "Dependabot PRs can only access Dependabot secrets, not regular repository secrets."
          echo "See: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#accessing-secrets"
          echo ""
          echo "To fix: either add 'rsync_private_key' under Settings > Secrets > Dependabot,"
          echo "or restrict deploy steps to push events only (not pull_request)."
          exit 1
        else
          echo "DEPLOY_KEY is present. Proceeding with deployment."
        fi
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}

    - name: Upload web assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Upload server script
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy-server
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist-server/*'
        dest: 'rsync-user@tiye.me:/servers/timegrass/'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-server.outputs.status }}"
